# DigitalOcean App Platform spec. Create the app with:
#   doctl apps create --spec .do/app.yaml
# and apply later changes with:
#   doctl apps update <app-id> --spec .do/app.yaml
name: workog
static_sites:
  - name: web
    github:
      repo: myorb/static-job
      branch: main
      # every push to main rebuilds the site, including the daily data commit
      deploy_on_push: true
    dockerfile_path: Dockerfile
    output_dir: /app/dist
    error_document: 404.html
domains:
  - domain: workog.com
    type: PRIMARY
