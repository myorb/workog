name: Daily update

on:
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC; GitHub may start it 10-30 minutes late
  workflow_dispatch:

permissions:
  contents: write

# shared with deploy.yml so a developer push and the daily run never deploy at once
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Fetch jobs
        id: fetch
        run: bun run fetch

      # Pushes made with GITHUB_TOKEN do not trigger deploy.yml, so this job
      # commits, builds and deploys by itself.
      - name: Commit data
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: daily update $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Build
        if: steps.fetch.outputs.changed == 'true'
        run: bun run build

      - name: Deploy to Cloudflare Pages
        if: steps.fetch.outputs.changed == 'true'
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Alert on source fallbacks
        if: always() && steps.fetch.outcome == 'success'
        run: bun run alert

      - name: Alert on workflow failure
        if: failure()
        run: bun run alert "🚨 Workog daily update failed; the site keeps serving the previous version."
