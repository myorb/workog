name: Daily update

on:
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC; GitHub may start it 10-30 minutes late
  workflow_dispatch:
    inputs:
      all:
        description: Fetch every job, ignoring maxJobs (slow; Amazon alone is about 20,000 jobs)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.fetch.outputs.changed }}
    env:
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Fetch jobs
        id: fetch
        run: bun run fetch ${{ inputs.all && '--all' || '' }}

      # DigitalOcean App Platform rebuilds and deploys the site on every push to
      # main (see .do/app.yaml), so this job only commits the data.
      - name: Commit data
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: daily update $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Alert on source fallbacks
        if: always() && steps.fetch.outcome == 'success'
        run: bun run alert

      - name: Alert on workflow failure
        if: failure()
        run: bun run alert "🚨 Workog daily update failed; the site keeps serving the previous version."

  # Separate job so waiting for the deploy doesn't count against the fetch's timeout
  ping:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOOGLE_INDEXING_KEY: ${{ secrets.GOOGLE_INDEXING_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Notify search engines once the deploy is live
        run: bun run ping
